services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kiashi:${POSTGRES_PASSWORD}@postgres:5432/kiashi
      API_PORT: 8787
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      production:
        ipv4_address: 172.28.0.20
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiashi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside this file}
      POSTGRES_DB: kiashi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiashi -d kiashi"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      production:
        ipv4_address: 172.28.0.30

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
      target: proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/certs:/etc/nginx/certs:ro
    networks:
      production:
        ipv4_address: 172.28.0.10

volumes:
  postgres-data:

networks:
  production:
    ipam:
      config:
        - subnet: 172.28.0.0/24
