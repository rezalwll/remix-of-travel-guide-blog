name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_TEST: postgresql://kiashi:kiashi@localhost:5432/kiashi_test
      DATABASE_URL: postgresql://kiashi:kiashi@localhost:5432/kiashi_test
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiashi
          POSTGRES_PASSWORD: kiashi
          POSTGRES_DB: kiashi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiashi -d kiashi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build:api
      - run: npm run lint
      - run: npm run provider:status -- --json
      - run: npm run provider:check -- --json
      - run: npm run test:providers
      - run: npm test -- --run
      - run: npm run test:api -- --run
      - run: npm run build:web
      - run: npm run release:check
        env:
          RELEASE_CHECK_DATABASE: "true"
      - run: docker build --target api --tag kiashi:${{ github.sha }} .
      - name: Smoke production API container
        shell: bash
        run: |
          IMAGE="kiashi:${{ github.sha }}"
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0"
          docker run --detach --name kiashi-smoke --network host \
            --env NODE_ENV=production \
            --env DATABASE_URL="$DATABASE_URL" \
            --env WEB_ORIGIN=https://example.test \
            --env API_PUBLIC_URL=https://api.example.test \
            --env TRUST_PROXY=127.0.0.1 \
            --env MOCK_PAYMENT_SECRET=ci-only-secret-with-more-than-32-characters \
            --env APP_VERSION=ci-smoke \
            --env GIT_SHA=${{ github.sha }} \
            --env BUILD_TIME=2026-01-01T00:00:00.000Z \
            "$IMAGE"
          trap 'docker logs kiashi-smoke; docker rm --force kiashi-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8787/health/ready && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8787/health/version | grep -q 'ci-smoke'
          docker stop --time 15 kiashi-smoke
          test "$(docker inspect kiashi-smoke --format '{{.State.ExitCode}}')" = "0"
          docker rm kiashi-smoke
          trap - EXIT
      - run: npx playwright install --with-deps chromium
      - run: npm run db:seed
      - run: npx playwright test
      - run: npm audit --audit-level=high
        continue-on-error: true # advisory visibility; upgrades that require breaking majors are tracked manually
