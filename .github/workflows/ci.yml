name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_TEST: postgresql://kiashi:kiashi@localhost:5432/kiashi_test
      DATABASE_URL: postgresql://kiashi:kiashi@localhost:5432/kiashi_test
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiashi
          POSTGRES_PASSWORD: kiashi
          POSTGRES_DB: kiashi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiashi -d kiashi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build:api
      - run: npm run lint
      - run: npm run provider:status -- --json
      - run: npm run provider:check -- --json
      - run: npm run test:providers
      - run: npm test -- --run
      - run: npm run test:api -- --run
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm audit --audit-level=high
        continue-on-error: true # advisory visibility; upgrades that require breaking majors are tracked manually
