name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build:api
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build:web
