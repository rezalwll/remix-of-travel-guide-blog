limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
server_tokens off;

server {
  listen 80;
  server_name example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name example.com;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  client_max_body_size 1m;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  include /etc/nginx/snippets/kiashi-security-headers.conf;

  root /usr/share/nginx/html;
  location /assets/ { include /etc/nginx/snippets/kiashi-security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /index.html { include /etc/nginx/snippets/kiashi-security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /api/ {
    include /etc/nginx/snippets/kiashi-security-headers.conf;
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://app:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
  }
  location /health/ {
    include /etc/nginx/snippets/kiashi-security-headers.conf;
    proxy_pass http://app:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
  }
  location / { include /etc/nginx/snippets/kiashi-security-headers.conf; try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
