limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
server_tokens off;

server {
  listen 80;
  server_name _;

  # Keep HTTP-01 reachable so short-lived IP certificates can renew without
  # stopping the reverse proxy. Everything else remains HTTPS-only.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name _;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  client_max_body_size 1m;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  include /etc/nginx/snippets/kiashi-security-headers.conf;

  location ^~ /_next/static/ {
    include /etc/nginx/snippets/kiashi-security-headers.conf;
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location = /_next/image {
    include /etc/nginx/snippets/kiashi-security-headers.conf;
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
  }
  location ^~ /api/ {
    include /etc/nginx/snippets/kiashi-security-headers.conf;
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://app:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
  }
  location ^~ /health/ {
    include /etc/nginx/snippets/kiashi-security-headers.conf;
    proxy_pass http://app:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
  }
  location = /healthz {
    include /etc/nginx/snippets/kiashi-security-headers.conf;
    proxy_pass http://web:3000/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
  }
  location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico)$ {
    include /etc/nginx/snippets/kiashi-security-headers.conf;
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000" always;
  }
  location / {
    include /etc/nginx/snippets/kiashi-security-headers.conf;
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache" always;
  }
}
